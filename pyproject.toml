[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-lens"
version = "1.0.0"
description = "Registry + conformance analyzer for Claude Code plugins."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alan Vo", email = "alanvo@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[project.scripts]
nexus-lens = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]